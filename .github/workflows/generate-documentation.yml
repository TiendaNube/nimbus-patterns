name: "generate-documentation"

# Runs on manual dispatch inside nimbus-patterns, and is also callable as a
# reusable workflow — post-release.yml chains into it directly instead of
# dispatching it by workflow ID over the API with a PAT.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set Node version
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Cache NPM dependencies
        uses: actions/cache@v3
        id: cache-dependencies
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: yarn

  generate-documents:
    needs: [setup]
    runs-on: ubuntu-latest
    # Needed for create-pull-request to push the docs branch and open the PR.
    permissions:
      contents: write
      pull-requests: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache NPM dependencies
        uses: actions/cache@v3
        id: cache-dependencies
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: yarn

      - name: Generate documents
        run: yarn build:docs

      - name: Create documentation PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: updated documentation for components and subcomponents [skip ci]"
          title: "chore: update component documentation"
          body: |
            Automated documentation update — regenerates component and subcomponent docs.
          add-paths: |
            **/*.docs.json
          branch: docs/update-${{ github.run_id }}
          base: master
          delete-branch: true
