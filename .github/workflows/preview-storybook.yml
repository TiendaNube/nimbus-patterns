name: "preview-storybook"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check_release.outputs.should_build }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Check for release files in ./yarn/versions
        id: check_release
        run: |
          if grep -q "^releases:" .yarn/versions/* 2>/dev/null; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "## ⚠️ Storybook preview not available" >> "$GITHUB_STEP_SUMMARY"
            echo "Storybook preview is not available for this PR because there are no changes available for a new release." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    # A called workflow can never get more than the caller grants: this must
    # match the permissions declared on the called job itself. id-token:write
    # in particular is never part of the default GITHUB_TOKEN permissions —
    # without it, the AWS OIDC step in the called workflow fails to mint a
    # token and the preview deploy breaks for every PR.
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    # TODO: una vez mergeado y tageado TiendaNube/nimbus-design-system#<PR-fase2>,
    # cambiar el ref de la rama a un tag (p. ej. @workflows-v1).
    uses: TiendaNube/nimbus-design-system/.github/workflows/preview-storybook-deploy.yml@chore/reusable-workflows-phase1
    with:
      s3-prefix: patterns
      build-tokens-icons: false
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE: ${{ secrets.AWS_DEPLOY_ROLE }}
