name: "create-github-tag"

# Runs on manual dispatch inside nimbus-patterns, and is also callable as a
# reusable workflow — post-release.yml chains into it directly instead of
# dispatching it by workflow ID over the API with a PAT.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  create-github-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Generate tag release
        uses: StephaneBour/actions-calver@v1.5
        id: calver
        with:
          date_format: "%Y.%m.%d"
          release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          release_branch: master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v3
      - uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.calver.outputs.release }}

  # NOTE for reviewers: this used to be dispatched via curl against a
  # hardcoded workflow ID, always as a standalone `workflow_dispatch` run —
  # so `github.event_name` above was never 'push', and the `release` input
  # to actions-calver always evaluated false. Chained like this from
  # post-release.yml (triggered on the release PR's merge), `release` still
  # won't be 'push', so this specific condition stays false either way —
  # flagging in case that's not actually the intent.
  create-github-release:
    needs: [create-github-tag]
    permissions:
      contents: write
      discussions: write
    uses: ./.github/workflows/create-github-relase.yml
