name: "create-github-tag"

# Runs on manual dispatch inside nimbus-patterns, and is also callable as a
# reusable workflow — post-release.yml chains into it directly instead of
# dispatching it by workflow ID over the API with a PAT.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  create-github-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Generate tag release
        uses: StephaneBour/actions-calver@v1.5
        id: calver
        with:
          date_format: "%Y.%m.%d"
          # `release` only gates whether this action itself creates a GitHub
          # Release — the version string in `outputs.release` (used below to
          # tag) is computed either way. This used to read
          # `github.event_name == 'push' && github.ref == 'refs/heads/master'`,
          # left over from when this workflow was dispatched standalone by
          # curl against a hardcoded workflow ID. Chained via `workflow_call`
          # from post-release.yml (triggered on `pull_request: closed`), that
          # condition can never be true — `github.event_name` here is always
          # `pull_request`, never `push`. Hardcoded to match what it always
          # evaluated to in practice, and what nimbus-design-system's own
          # create-github-tag.yml already does explicitly: this action never
          # creates the release; the separate create-github-release job below
          # does that.
          release: false
          release_branch: master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v3
      - uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.calver.outputs.release }}

  create-github-release:
    needs: [create-github-tag]
    permissions:
      contents: write
      discussions: write
    uses: ./.github/workflows/create-github-relase.yml
