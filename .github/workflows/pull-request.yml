name: check-quality

on: [pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  pipeline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: ./.github/actions/setup-node-deps

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test:ci

      - name: Run build all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          export NODE_OPTIONS="--max_old_space_size=12288"
          # Keep production checks for mixed diffs and unavailable file lists.
          if [[ "$GITHUB_HEAD_REF" == prototype/* ]] && \
            changed_files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename') && \
            [ -n "$changed_files" ] && \
            ! printf '%s\n' "$changed_files" | grep -qvE '^packages/react/src/prototypes/|^\.github/PULL_REQUEST_TEMPLATE/prototype\.md$'; then
            echo "Prototype-only pull request; skipping production package builds."
            # A full Storybook build also handles deletion of the last prototype.
            yarn build:storybook
          else
            yarn build:all
          fi

      - name: Check nimbus-source-map.yml is up to date
        run: yarn source-map:check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_AUTOMATION_FROM_JUNIOR_CONQUISTA }}
