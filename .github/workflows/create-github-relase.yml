name: "create-github-relase"

# Also callable locally — create-github-tag.yml chains into this after
# creating the tag, instead of dispatching it by workflow ID with a PAT.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  create-github-relase:
    # A called workflow can never get more than the caller grants: this must
    # match the permissions declared on the called job itself. Without it,
    # ncipollo/release-action fails to create the release depending on this
    # org's default GITHUB_TOKEN permissions.
    permissions:
      contents: write
      discussions: write
    uses: TiendaNube/nimbus-design-system/.github/workflows/create-github-relase.yml@workflows-v1
    # No secrets used by this workflow beyond the automatic GITHUB_TOKEN.
